name: demo
description: Minimal addon that echoes a greeting built from parameters.
author: lazyaddon team
version: "1.0"
enabled: true
os: any
category: 00. Demo
params:
  - name: who
    type: string
    required: true
    description: Name to greet.
  - name: count
    type: string
    default: "1"
    description: Times to greet.
tool:
  name: demo
  execute_command: echo "hello {who} x{count}"
